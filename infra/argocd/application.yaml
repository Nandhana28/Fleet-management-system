apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleetpulse
  namespace: argocd
spec:
  project: fleetpulse
  source:
    repoURL: https://github.com/Nandhana28/Fleet-management-system
    targetRevision: develop
    path: infra/helm-charts/fleetpulse
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
