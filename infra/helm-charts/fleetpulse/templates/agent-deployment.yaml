apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetpulse-agent
  labels:
    app: fleetpulse-agent
spec:
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      app: fleetpulse-agent
  template:
    metadata:
      labels:
        app: fleetpulse-agent
    spec:
      containers:
        - name: agent
          image: {{ .Values.agent.image }}:{{ .Values.agent.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.agent.port }}
          envFrom:
            - configMapRef:
                name: fleetpulse-config
            - secretRef:
                name: fleetpulse-secrets
          resources:
            requests:
              memory: {{ .Values.agent.resources.requests.memory }}
              cpu: {{ .Values.agent.resources.requests.cpu }}
            limits:
              memory: {{ .Values.agent.resources.limits.memory }}
              cpu: {{ .Values.agent.resources.limits.cpu }}
            livenessProbe:
              httpGet:
                path: /health
                port: {{ .Values.agent.port }}
              initialDelaySeconds: 20
              periodSeconds: 30
              failureThreshold: 3