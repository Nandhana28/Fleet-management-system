apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleetpulse-redis
spec:
  serviceName: fleetpulse-redis-service
  replicas: 1
  selector:
    matchLabels:
      app: fleetpulse-redis
  template:
    metadata:
      labels:
        app: fleetpulse-redis
    spec:
      containers:
        - name: redis
          image: redis:7.0
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: fleetpulse-redis-service
spec:
  selector:
    app: fleetpulse-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
