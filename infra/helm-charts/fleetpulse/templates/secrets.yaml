apiVersion: v1
kind: Secret
metadata:
  name: fleetpulse-secrets
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.awsAccessKeyId | default "placeholder" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.awsSecretAccessKey | default "placeholder" | quote }}
  JWT_SECRET_KEY: {{ .Values.jwtSecret | default "change-me-in-production" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.anthropicApiKey | default "" | quote }}
  GROQ_API_KEY: {{ .Values.groqApiKey | default "" | quote }}
  TWILIO_ACCOUNT_SID: {{ .Values.twilioAccountSid | default "" | quote }}
  TWILIO_AUTH_TOKEN: {{ .Values.twilioAuthToken | default "" | quote }}
  TWILIO_VERIFY_SERVICE_SID: {{ .Values.twilioVerifyServiceSid | default "" | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.googleClientId | default "" | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.googleClientSecret | default "" | quote }}