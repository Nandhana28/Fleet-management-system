# Production overrides — real AWS, higher resources

backend:
  replicas: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

frontend:
  replicas: 3

agent:
  replicas: 2

hpa:
  backend:
    minReplicas: 3
    maxReplicas: 10
    cpuThreshold: 60
  frontend:
    minReplicas: 3
    maxReplicas: 8
    cpuThreshold: 60

ingress:
  enabled: true
  host: fleetpulse.yourdomain.com

env:
  useLocalstack: "false"
  appEnv: "production"
  frontendUrl: "https://fleetpulse.yourdomain.com"