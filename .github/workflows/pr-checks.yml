name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install black flake8 pytest scikit-learn pandas numpy boto3

      - name: Run Black
        run: black --check .

      - name: Run Flake8
        run: flake8 . --max-line-length=150 --exclude=.terraform,__pycache__

      - name: Run Tests
        run: pytest ml/anomaly_detection/test_model.py -v

      - name: Block merge if tests fail
        if: failure()
        run: exit 1
