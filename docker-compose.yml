services:

  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetpulse-backend
    image: fleetpulse-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - USE_LOCALSTACK=${USE_LOCALSTACK:-true}
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - localstack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetpulse-celery-worker
    image: fleetpulse-backend
    command: celery -A tasks.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - USE_LOCALSTACK=${USE_LOCALSTACK:-true}
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - localstack
    restart: unless-stopped

  # ─── Celery Beat (Scheduler) ────────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetpulse-celery-beat
    image: fleetpulse-backend
    command: celery -A tasks.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    restart: unless-stopped

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fleetpulse-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── LocalStack (fake AWS for local dev) ────────────────────────────────────
  localstack:
    image: localstack/localstack:3.0.0
    container_name: fleetpulse-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3,sns,sqs,lambda,secretsmanager,kinesis
      - DEFAULT_REGION=ap-south-1
      - LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT=1
      - PERSISTENCE=1
    volumes:
      - localstack_data:/var/lib/localstack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: fleetpulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: fleetpulse-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=fleetpulse123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  localstack_data:
  grafana_data: